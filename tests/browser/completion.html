<!doctype html><html><head><meta charset="utf-8"><title>Checklist alignment checks</title><link rel="stylesheet" href="../../extension/content.css"><style>body{font:14px Arial;color:#041863;padding:40px;background:#e8eaf1}table{border-collapse:collapse;background:white;width:700px}td,th{padding:12px;text-align:left}td:first-child,th:first-child{width:340px}.row{display:flex;align-items:center;background:white;width:700px;min-height:56px}.title{padding:12px;width:340px}h2{margin-top:35px}.tka-cell{background:#eaf3fc}.status{padding:12px}</style></head><body><h1>Checklist alignment checks</h1><p>Local fixture with the extension's actual column and tick styles.</p>
<h2>Classic table</h2><table><thead><tr><th>Task</th><th class="tka-cell">Checklist</th><th>Status</th></tr></thead><tbody><tr><td>Completed task</td><td class="tka-cell"><button class="tka-indicator tka-completed-indicator" aria-label="Checklist complete"><span class="tka-complete-tick"></span></button></td><td>Done</td></tr></tbody></table>
<h2>Modern flex row</h2><div class="row"><div class="title">Completed task</div><div class="tka-cell"><button class="tka-indicator tka-completed-indicator" aria-label="Checklist complete"><span class="tka-complete-tick"></span></button></div><div class="status">Done</div></div>
</body></html>
